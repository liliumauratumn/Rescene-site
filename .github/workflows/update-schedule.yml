name: Update schedule

on:
  schedule:
    - cron: '17 0,6,12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: rescene-schedule-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UPDATE_BRANCH: automation/schedule-update
      GH_TOKEN: ${{ github.token }}
      MAX_SAFE_SCHEDULE_CHANGES: 5
      AUTO_MERGE_MAX_ATTEMPTS: 18
      AUTO_MERGE_RETRY_SECONDS: 10
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Continue the schedule branch if it exists
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          default_branch="${{ github.event.repository.default_branch }}"
          git fetch origin "$default_branch"
          if git ls-remote --exit-code --heads origin "$UPDATE_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$UPDATE_BRANCH:$UPDATE_BRANCH"
            git switch "$UPDATE_BRANCH"
            git merge --no-edit "origin/$default_branch"
          else
            git switch -c "$UPDATE_BRANCH" "origin/$default_branch"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect schedule and classify risk
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          report_path="$RUNNER_TEMP/schedule-update-report.json"
          SCHEDULE_UPDATE_REPORT="$report_path" npm run update:schedule
          test -s "$report_path"
          echo "requires_review=$(jq -r '.requiresReview' "$report_path")" >> "$GITHUB_OUTPUT"
          echo "auto_merge_eligible=$(jq -r '.autoMergeEligible' "$report_path")" >> "$GITHUB_OUTPUT"
          echo "applied_change_count=$(jq -r '.appliedChangeCount' "$report_path")" >> "$GITHUB_OUTPUT"
          echo "### Schedule safety report" >> "$GITHUB_STEP_SUMMARY"
          jq -r '"- Applied: \(.appliedChangeCount) (added \(.addedCount), updated \(.updatedCount))\n- Schedule check date changed: \(.syncChanged)\n- Review candidates: \(.blockingPendingCount)\n- Auto-merge eligible: \(.autoMergeEligible)\n- Reasons: \((.unsafeReasons | join(", ")) // "none")"' "$report_path" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate data and site
        run: npm run verify

      - name: Commit schedule-only changes
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git status --porcelain | sed -E 's/^.. //' | grep -Ev '^(data/schedules\.json|data/schedule-sync\.json|data/content-meta\.json|data/pending/schedules\.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          if ! git diff --quiet -- data/schedules.json data/schedule-sync.json data/content-meta.json data/pending/schedules.json; then
            git add data/schedules.json data/schedule-sync.json data/content-meta.json data/pending/schedules.json
            git commit -m "chore(schedule): sync official calendar"
          fi
          default_branch="${{ github.event.repository.default_branch }}"
          ahead="$(git rev-list --count "origin/$default_branch..HEAD")"
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"
          if [ "$ahead" -gt 0 ]; then
            git push --set-upstream origin "$UPDATE_BRANCH"
          else
            echo "No schedule changes." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Auto-merge safe schedule or open review PR
        if: steps.branch.outputs.ahead != '0'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUIRES_REVIEW: ${{ steps.collect.outputs.requires_review }}
        run: node scripts/route-schedule-pr.mjs
